  }
  return `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" data-sheet><div class="grip" aria-hidden="true"></div>${body}</div></div>`;
}

/* ======================= Render ========================================== */
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
const $live = document.getElementById('live');
const VIEWS = { home: viewHome, import: viewImport, manual: viewManual, extract: viewExtract, evaluate: viewEvaluate, plans: viewPlans, plan: viewPlan, progress: viewProgress, submitted: viewSubmitted };
const lastPct = {};

/* Swiss typography (v18): presentational wrappers only, the text is unchanged.
   Internal page titles: first word strong, the rest muted. Suggested-tasks count: one big numeral. */
function swissType() {
  $app.querySelectorAll('.screen:has(> .topbar) .page-head .h1').forEach((h) => {
    const t = h.textContent.trim(); const i = t.indexOf(' ');
    if (i > 0) h.innerHTML = `${esc(t.slice(0, i))} <span class="sw-dim">${esc(t.slice(i + 1))}</span>`;
  });
  $app.querySelectorAll('.screen:has(> .topbar) .sg-bar > span.small').forEach((el) => {
    const m = el.textContent.match(/^(\d+) of (\d+) selected · (.*)$/);
    if (m) { el.classList.add('sw-count'); el.innerHTML = `<b>${m[1]}</b> <i>of ${m[2]} selected<br> ${esc(m[3])}</i>`; }
  });
}

function render() {
  const active = document.activeElement;
  const key = active && active.dataset ? active.dataset.k : null;
  const selStart = active && 'selectionStart' in active ? (() => { try { return active.selectionStart; } catch { return null; } })() : null;
  const oldScroll = $app.querySelector('.scroll');
  const scrollTop = oldScroll ? oldScroll.scrollTop : 0;
  const entering = S.enter;

  $app.innerHTML = VIEWS[S.screen]() + viewSheet();
  swissType();
  const screen = $app.querySelector('.screen');
  if (entering && screen) screen.classList.add('enter');

  const sc = $app.querySelector('.scroll');
  if (sc && !entering) sc.scrollTop = scrollTop;

  // Images: graceful fallback
  $app.querySelectorAll('img[data-fallback]').forEach((im) => im.addEventListener('error', () => {
    im.removeAttribute('data-fallback');
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${PLACEHOLDER}</svg>`);
    im.alt = 'Image unavailable.';
  }, { once: true }));

  $app.querySelectorAll('textarea.sg-text').forEach(grow);

  // Progress bars animate from their previous value
  $app.querySelectorAll('.bar > i').forEach((el, i) => {
    const id = `${S.screen}-${S.cur}-${i}`; const to = +el.dataset.pct;
    const from = lastPct[id] ?? (entering ? 0 : to);
    el.style.width = from + '%';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = to + '%'; }));
    lastPct[id] = to;
  });

  // Submission modal: checkbox and Confirm button always reflect the sheet's own state
  if (S.sheet && S.sheet.type === 'mark') {
    const box = $app.querySelector('#sh-confirm'), ok = !!S.sheet.ok;
    if (box) box.checked = ok;
    const btn = $app.querySelector('#confirm-mark'); if (btn) btn.disabled = !ok;
  }

  // Focus management
  const sheet = $app.querySelector('[data-sheet]');
  if (sheet && S.sheetJustOpened) {
    S.sheetJustOpened = false;
    (sheet.querySelector('[data-autofocus]') || sheet.querySelector('input,select,textarea') || sheet.querySelector('button:not(:disabled)'))?.focus();
  } else if (S.focusMain) {
    S.focusMain = false;
    $app.querySelector('[data-main]')?.focus({ preventScroll: true });
  } else if (S.focusKey) {
    $app.querySelector(`[data-k="${S.focusKey}"]`)?.focus(); S.focusKey = null;
  } else if (key) {
    const el = $app.querySelector(`[data-k="${key}"]`);
    if (el) { el.focus({ preventScroll: true }); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch {} } }
  }
  S.enter = false;
  persist();
}

function grow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function go(screen, patch = {}) {
  if (screen !== 'plan') S.sugg = null;
  S.screen = screen; S.sheet = null; S.adding = null; S.enter = true; S.focusMain = true;
  Object.assign(S, patch);
  render();
  const sc = $app.querySelector('.scroll'); if (sc) sc.scrollTop = 0;
}
function openSheet(sheet) { clearTimeout(toastTimer); $toast.innerHTML = ''; S.toast = null; sheetReturnKey = document.activeElement?.dataset?.k || null; S.sheet = sheet; S.sheetJustOpened = true; render(); }
function closeSheet() { S.sheet = null; S.focusKey = sheetReturnKey; render(); }
function announce(msg) { $live.textContent = ''; setTimeout(() => { $live.textContent = msg; }, 30); }
function toast(msg, undo) {
  clearTimeout(toastTimer);
  S.toast = { msg, undo };
  $toast.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undo ? '<button class="btn-text" data-act="undo">Undo</button>' : ''}</div>`;
  toastTimer = setTimeout(() => { $toast.innerHTML = ''; S.toast = null; }, undo ? 6000 : 3500);
}

/* ======================= Actions ========================================= */
const A = {
  'go-home': () => go('home'),
  'go-import': () => go('import', { urlError: null }),
  'go-plans': () => {
    const o = S.opps.find((x) => x.id === S.cur && x.status === 'In Progress');
    const active = S.opps.filter((x) => x.status === 'In Progress');
    if (o) go('plan', { tab: 'Tasks' });
    else if (active.length === 1) go('plan', { cur: active[0].id, tab: 'Tasks' });
    else go('plans');
  },
  'go-plans-index': () => go('plans'),
  filter: (d) => { S.filter = d.f; render(); },
  open: (d) => {
    const o = S.opps.find((x) => x.id === d.id); if (!o) return;
    S.cur = o.id; S.draft = null;
    go(o.status === 'Evaluating' ? 'evaluate' : o.status === 'Submitted' ? 'submitted' : 'plan', { tab: 'Tasks', fromPlan: false });
  },
  'open-plan': (d) => go('plan', { cur: d.id, tab: 'Tasks' }),
  about: () => openSheet({ type: 'about' }),
  'ask-reset': () => { S.sheet.confirmReset = true; S.focusKey = 'sh-reset'; render(); },
  reset: () => { try { localStorage.removeItem(STORE_KEY); } catch {} S.opps = normalise(seedOpportunities()); S.cur = null; S.draft = null; S.filter = 'All'; go('home'); toast('Reset to the starting examples.'); },
  'to-samples': () => { const first = $app.querySelector('.sample'); first?.scrollIntoView({ block: 'center', behavior: 'smooth' }); first?.focus({ preventScroll: true }); },
  sample: (d) => { S.url = d.url; S.urlError = null; S.focusKey = 'extract'; render(); },
  'cancel-extract': () => { extractTimers.forEach(clearTimeout); go('import'); },
  'back-import': () => go('import', { draft: null }),
  opened: () => { const o = opp(); o.opened = isoOf(new Date()); setTimeout(() => { render(); announce('Application website opened in a new tab. Come back here after you submit.'); }, 0); },
  manual: () => { S.manualUrl = (S.urlError && S.urlError.manual) || S.url; S.manualError = null; S.manualVals = {}; go('manual', { formMode: null }); },
  'close-sheet': () => closeSheet(),
  scrim: (d, el, e) => { if (e.target === el) closeSheet(); },
  dismiss: () => openSheet({ type: 'dismiss' }),
  'confirm-dismiss': () => {
    const o = opp();
    if (o.status === 'New') { S.draft = null; go('home'); toast('Opportunity dismissed.'); return; }
    const idx = S.opps.indexOf(o); S.opps.splice(idx, 1); S.cur = null;
    go('home'); toast('Opportunity removed.', () => { S.opps.splice(idx, 0, o); render(); });
  },
  'save-later': () => { const o = commitDraft('Evaluating'); go('home', { filter: 'All' }); toast(`Saved to evaluate later: ${o.title}`); },
  'save-plan': () => {
    const t = tally(opp());
    if (t.no || t.unsure) { openSheet({ type: 'remind' }); return; }
    A['create-plan']();
  },
  'create-plan': () => {
    const o = commitDraft('In Progress'); o.status = 'In Progress';
    const n = startSuggestions(o);
    go('plan', { tab: 'Tasks' });
    toast(n ? `Plan created. Review ${plural(n, 'suggested task')}.` : 'Plan created. Add your first task.');
  },
  'review-answers': () => { S.sheet = null; render(); const d = document.getElementById('dec-h'); d?.scrollIntoView({ block: 'start' }); $app.querySelector('[data-k^="c-eligible"]')?.focus({ preventScroll: true }); },
  'practice-site': (d) => openSheet({ type: 'practice', which: d.which }),
  'practice-visited': () => { const o = opp(); o.opened = isoOf(new Date()); S.sheet = null; S.focusKey = 'mark'; render(); announce('Simulated visit done. Step 1 complete.'); },
  'edit-details': () => { S.formReturn = S.screen; S.manualVals = null; S.manualError = null; go('manual', { formMode: 'edit' }); },
  'form-back': () => go(S.formMode === 'edit' ? (S.formReturn || 'evaluate') : 'import', { formMode: S.formMode === 'edit' ? null : S.formMode }),
  'break-tasks': () => { const o = opp(); const n = startSuggestions(o); if (!n) { S.sugg = null; toast('All suggestions are already in your plan.'); return; } S.focusMain = true; S.enter = true; render(); },
  'sugg-cancel': () => { S.sugg = null; go('plan', { tab: 'Tasks' }); toast('Suggestions closed. Use Break into Tasks to see them again.'); },
  'sugg-all': (d) => { S.sugg.items.forEach((x) => (x.on = d.on === '1')); render(); },
  'sugg-move': (d) => { const a = S.sugg.items; const i = a.findIndex((x) => x.id === d.id), j = i + +d.dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; S.focusKey = `sg-${d.dir < 0 ? 'up' : 'dn'}-${d.id}`; render(); announce(`Moved ${d.dir < 0 ? 'up' : 'down'}.`); },
  'sugg-del': (d) => { const a = S.sugg.items; const i = a.findIndex((x) => x.id === d.id); const [gone] = a.splice(i, 1); S.focusKey = a[i] ? `sg-t-${a[i].id}` : 'sg-new'; render(); toast('Suggestion removed.', () => { a.splice(i, 0, gone); render(); }); },
  'sugg-accept': () => {
    const o = opp(); const have = new Set(o.tasks.flatMap((t) => [normTask(t.t), t.sk].filter(Boolean)));
    const add = S.sugg.items.filter((x) => x.on && x.t.trim() && !have.has(normTask(x.t)) && (have.add(normTask(x.t)), true));
    const ids = add.map((x) => { const id = uid(); o.tasks.push({ id, t: x.t.trim(), d: false, week: x.week || null, ...(x.sk ? { sk: x.sk } : {}) }); return id; });
    S.sugg = null; go('plan', { tab: 'Tasks' });
    toast(`${plural(ids.length, 'task')} added to your plan.`, () => { o.tasks = o.tasks.filter((t) => !ids.includes(t.id)); render(); });
  },
  tab: (d) => { S.tab = d.tab; S.adding = null; S.focusKey = 'tab-' + d.tab; render(); },
  add: () => { S.adding = { t: '', week: '' }; S.focusKey = 'nt'; render(); },
  'cancel-add': () => { S.adding = null; S.focusKey = 'add'; render(); },
  'req-to-task': (d) => { const o = opp(); S.tab = 'Tasks'; S.adding = { t: o.reqs[+d.i].text, week: '' }; S.focusKey = 'nt'; render(); },
  toggle: (d, el) => {
    const o = opp(); const t = o.tasks.find((x) => x.id === d.id); t.d = !t.d; render();
    const b = $app.querySelector(`[data-k="tg-${t.id}"]`); b?.classList.add('pop'); b?.focus();
    const p = progress(o);
    announce(`${t.t} marked ${t.d ? 'complete' : 'not complete'}. ${p.d} of ${p.n} done.`);
    if (t.d && p.all) toast('All planned tasks are complete.');
  },
  'edit-task': (d) => openSheet({ type: 'task', id: d.id }),
  move: (d) => {
    const o = opp(); const t = o.tasks.find((x) => x.id === S.sheet.id);
    const g = (x) => (x.week || 'none');
    const same = o.tasks.filter((x) => g(x) === g(t)); const gi = same.indexOf(t); const other = same[gi + +d.dir];
    if (!other) return;
    const i = o.tasks.indexOf(t), j = o.tasks.indexOf(other); [o.tasks[i], o.tasks[j]] = [o.tasks[j], o.tasks[i]];
    render(); announce(`Moved ${d.dir < 0 ? 'up' : 'down'}.`);
  },
  'delete-task': () => {
    const o = opp(); const idx = o.tasks.findIndex((x) => x.id === S.sheet.id); const [t] = o.tasks.splice(idx, 1);
    S.sheet = null; S.focusKey = 'add'; render();
    toast('Task deleted.', () => { o.tasks.splice(idx, 0, t); render(); });
  },
  'go-progress': () => go('progress'),
  'back-plan': () => go('plan', { tab: 'Tasks' }),
  mark: () => openSheet({ type: 'mark', ok: false }),
  'confirm-mark': () => {
    const o = opp(); if (!S.sheet.ok) return;
    o.status = 'Submitted'; o.submittedAt = isoOf(new Date());
    go('submitted', { fromPlan: true });
  },
  unsubmit: () => { const o = opp(); o.status = 'In Progress'; delete o.submittedAt; go('plan', { tab: 'Tasks' }); toast('Moved back to In Progress.'); },
  'dashboard-after': () => go('home', { filter: 'All', fromPlan: false }),
  undo: () => { const u = S.toast && S.toast.undo; $toast.innerHTML = ''; S.toast = null; if (u) { u(); announce('Undone.'); } }
};
function saveCorrections(o, v) {
  const before = editVals(o);
  o.title = v.title; o.org = v.org; o.type = v.type; o.location = v.location;
  const field = (key, val, qKey, noteKey) => {
    const changed = val !== before[key];
    if (changed) { o[key] = val || null; if (noteKey) o[noteKey] = ''; o[qKey] = val ? 'you' : 'missing'; }
    else if (v['chk_' + key] && val) o[qKey] = 'you';
  };
  field('deadline', v.deadline, 'deadlineQ', 'deadlineNote');
  field('fee', v.fee, 'feeQ', 'feeNote');
  if (v.award !== before.award) { o.award = v.award || null; o.awardQ = v.award ? 'you' : 'missing'; }
  const lines = (key) => {
    const old = new Map(o[key].map((x) => [x.text, x]));
    const ticked = !!v['chk_' + key];
    o[key] = (v[key] || '').split('\n').map((t) => t.trim()).filter(Boolean).map((text) => {
      const prev = old.get(text);
      return prev ? { ...prev, q: ticked ? 'you' : prev.q } : { text, q: 'you' };
    });
  };
  lines('elig'); lines('reqs');
  S.manualVals = null; S.manualError = null;
  const back = S.formReturn || 'evaluate';
  go(back, { formMode: null, tab: back === 'plan' ? 'Requirements' : S.tab });
  toast('Details saved. Your changes are marked “Checked by you”.');
}

function commitDraft(status) {
  if (!S.draft) return opp();
  const o = { ...S.draft, status, savedAt: isoOf(new Date()) };
  S.opps.unshift(o); S.draft = null; S.cur = o.id; return o;
}

/* ---------- Event delegation --------------------------------------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'scrim' && e.target !== el) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault();
  const kind = f.dataset.submit;
  if (kind === 'extract') {
    const r = validateUrl(S.url);
    if (r.error) { S.urlError = r.error; S.focusKey = 'url'; render(); return; }
    S.url = r.url; S.urlError = null; go('extract'); runExtraction();
  } else if (kind === 'manual') {
    const fd = new FormData(f); const v = Object.fromEntries([...fd.entries()].map(([k, x]) => [k, String(x).trim()]));
    S.manualVals = v;
    if (!v.title) { S.manualError = 'Add a title so you can recognise this opportunity.'; S.focusKey = 'm-title'; render(); return; }
    if (S.formMode === 'edit') { saveCorrections(opp(), v); return; }
    const lines = (t) => t.split('\n').map((x) => x.trim()).filter(Boolean).map((text) => ({ text, q: 'you' }));
    S.draft = {
      id: 'manual-' + uid(), manual: true, type: v.type || 'Opportunity', title: v.title, org: v.org, location: v.location,
      deadline: v.deadline || null, deadlineQ: v.deadline ? 'you' : 'missing', deadlineNote: '',
      fee: v.fee || null, feeQ: v.fee ? 'you' : 'missing', feeNote: '',
      award: v.award || null, awardQ: v.award ? 'you' : 'missing',
      elig: lines(v.elig || ''), reqs: lines(v.reqs || ''),
      source: S.manualUrl, applyUrl: S.manualUrl, image: null,
      status: 'New', checks: {}, notes: '', tasks: []
    };
    S.cur = S.draft.id; go('evaluate');
  } else if (kind === 'sugg-add') {
    const t = (S.sugg.newT || '').trim();
    if (!t) { S.focusKey = 'sg-new'; announce('Type a task name first.'); return; }
    S.sugg.items.push({ id: uid(), t, from: 'Added by you', week: '', on: true }); S.sugg.newT = ''; S.focusKey = 'sg-new'; render(); announce(`Added: ${t}`);
  } else if (kind === 'add-task') {
    const t = S.adding.t.trim(); if (!t) return;
    const o = opp(); o.tasks.push({ id: uid(), t, d: false, week: S.adding.week || null });
    S.adding = { t: '', week: S.adding.week }; S.focusKey = 'nt'; render(); announce(`Task added: ${t}`);
  } else if (kind === 'save-task') {
    const o = opp(); const t = o.tasks.find((x) => x.id === S.sheet.id);
    const nt = (S.sheet.draftT ?? t.t).trim(); if (nt) t.t = nt;
    t.week = (S.sheet.draftW ?? t.week) || null;
    S.sheet = null; S.focusKey = 'ed-' + t.id; render(); announce('Task updated.');
  }
});
document.addEventListener('input', (e) => {
  const el = e.target; const k = el.dataset.input; if (!k) return;
  if (k === 'sugg-text' || k === 'sugg-week') { const x = S.sugg.items.find((i) => i.id === el.dataset.id); if (k === 'sugg-text') { x.t = el.value.replace(/\n/g, ' '); grow(el); const on = S.sugg.items.filter((i) => i.on && i.t.trim()).length; const b = $app.querySelector('[data-k="sg-accept"]'); if (b) { b.disabled = !on; b.textContent = `Add ${on || ''} to plan`; } } else x.week = el.value; return; }
  if (k === 'sugg-new') { S.sugg.newT = el.value; return; }
  if (k === 'url') {
    S.url = el.value;
    if (S.urlError) { S.urlError = null; render(); return; }
    const b = document.getElementById('extract-btn'); if (b) b.disabled = !el.value.trim();
  } else if (k === 'notes') {
    opp().notes = el.value; persist();
    const s = document.getElementById('notes-saved'); if (s) { s.textContent = 'Saved'; clearTimeout(s._t); s._t = setTimeout(() => (s.textContent = ''), 1500); }
  } else if (k === 'new-task') { S.adding.t = el.value; const b = document.getElementById('add-btn'); if (b) b.disabled = !el.value.trim(); }
  else if (k === 'new-week') { S.adding.week = el.value; }
  else if (k === 'edit-text') { S.sheet.draftT = el.value; }
  else if (k === 'edit-week') { S.sheet.draftW = el.value; }
});
document.addEventListener('change', (e) => {
  const el = e.target; const k = el.dataset.change; if (!k) return;
  if (k === 'check') { const o = opp(); o.checks = o.checks || {}; o.checks[el.dataset.key] = el.value; render(); const t = tally(o); announce(`Your answers: ${t.yes} yes, ${t.unsure} not sure, ${t.no} no.`); }
  if (k === 'sugg-on') { const x = S.sugg.items.find((i) => i.id === el.dataset.id); x.on = el.checked; render(); }
  if (k === 'confirm') { S.sheet.ok = el.checked; const b = document.getElementById('confirm-mark'); if (b) b.disabled = !el.checked; }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('sg-text')) { e.preventDefault(); return; } // task names are one line
  const sheet = $app.querySelector('[data-sheet]');
  if (sheet) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key === 'Tab') { // focus trap
      const f = [...sheet.querySelectorAll('button:not(:disabled),input,select,textarea,[tabindex="0"]')];
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  // Arrow keys move between plan tabs (WAI-ARIA tabs pattern)
  if (e.target.getAttribute && e.target.getAttribute('role') === 'tab' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const order = ['Tasks', 'Requirements', 'Notes']; const i = order.indexOf(S.tab);
    A.tab({ tab: order[(i + (e.key === 'ArrowRight' ? 1 : order.length - 1)) % order.length] });
  }
});

load();
render();
